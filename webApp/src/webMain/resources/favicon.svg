<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B26"/>
      <stop offset="50%" stop-color="#0F101A"/>
      <stop offset="100%" stop-color="#05060A"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#2A2C40" stroke-width="8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#25273A" stroke-width="6"/>

  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 8"/>
    <path d="M 96 256 C 120 160, 140 352, 160 256 C 172 120, 184 392, 196 256 C 208 80, 220 432, 232 256 C 244 140, 256 372, 268 256 C 280 180, 292 332, 304 256 C 320 200, 336 312, 352 256 C 376 220, 396 292, 416 256"
          fill="none"
          stroke="url(#waveGrad)"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <circle cx="256" cy="90" r="10" fill="#00E5FF"/>
  <circle cx="373" cy="139" r="8" fill="#7C4DFF"/>
  <circle cx="422" cy="256" r="8" fill="#FF007F"/>
  <circle cx="139" cy="139" r="8" fill="#00E5FF"/>
  <circle cx="90" cy="256" r="8" fill="#00E5FF"/>
</svg>
